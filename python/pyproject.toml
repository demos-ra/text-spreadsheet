[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-spreadsheet"
version = "0.4.0"
description = "Read and filter Excel, CSV, ODS, SQLite, Parquet and MTSV files — or a folder — as plain text"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Demos Ra", email = "demos_ra@hotmail.com" }]
keywords = [
    "mcp",
    "ai",
    "spreadsheet",
    "filter",
    "excel",
    "ods",
    "csv",
    "json",
    "sqlite",
    "parquet",
    "arrow",
    "mtsv",
]
dependencies = ["mtsv[arrow]>=0.6", "platformdirs", "mcp", "jsonpath-rfc9535>=1.0"]

[project.scripts]
text-spreadsheet = "text_spreadsheet.__main__:main"

[project.urls]
source = "https://github.com/demos-ra/text-spreadsheet"
issues = "https://github.com/demos-ra/text-spreadsheet/issues"
