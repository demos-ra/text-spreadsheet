[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-spreadsheets"
version = "0.1.0"
description = "Read a whole multi-sheet spreadsheet as MTSV text"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Demos Ra", email = "demos_ra@hotmail.com" }]
keywords = ["mtsv", "spreadsheet", "tabular data"]
dependencies = ["mtsv>=0.3"]

[project.urls]
source = "https://github.com/demos-ra/ai-spreadsheets"
issues = "https://github.com/demos-ra/ai-spreadsheets/issues"
