[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-spreadsheet"
version = "0.1.2"
description = "Let your AI read a whole spreadsheet as tab-separated text — Excel, ODS, SQLite and more"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Demos Ra", email = "demos_ra@hotmail.com" }]
keywords = ["mcp", "spreadsheet", "excel", "ods", "sqlite", "parquet", "mtsv"]
dependencies = ["mtsv[arrow]>=0.6", "platformdirs", "mcp"]

[project.scripts]
text-spreadsheet = "text_spreadsheet.__main__:main"

[project.urls]
source = "https://github.com/demos-ra/text-spreadsheet"
issues = "https://github.com/demos-ra/text-spreadsheet/issues"
